name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS syntax check (main <script> block)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=h.lastIndexOf('\n<script>\n');const e=h.lastIndexOf('\n</script>');fs.writeFileSync('/tmp/main.js',h.slice(s+9,e));"
          node --check /tmp/main.js
      - name: Batch (أ) storage/offline invariants
        run: node tests/batch-a-invariants.mjs
      - name: Batch (ب-٢) unified-list static guards
        run: node tests/b2-invariants.mjs
      - name: Batch (ب-٢) analyzeBatch count separation (mechanical)
        run: node tests/b2-analyze-counts.mjs
      - name: Self-check — missed_rounds guard يرسب بلا بوابة الرفع
        run: node tests/b2-missed-rounds.mjs --broken
      - name: Batch (ج) missed_rounds upload-hook (mechanical)
        run: node tests/b2-missed-rounds.mjs

  perf-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # google-chrome-stable مثبّت مسبقاً على ubuntu-latest — نستعمله بلا puppeteer/تنزيل Chromium
      - name: Locate Chrome
        run: google-chrome-stable --version || google-chrome --version
      - name: List perf benchmark (headless, synchronous)
        run: node tests/perf/run-bench.mjs --assert

  overflow-guard:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'   # puppeteer-core لا يُنزّل Chromium — نستعمل Chrome النظامي
      CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locate Chrome
        run: google-chrome-stable --version
      - name: Install deps (puppeteer-core فقط)
        run: npm ci
      - name: Self-check — حارس التجاوز يرسب على الكود المعطوب
        run: node tests/perf/overflow-guard.mjs --broken
      - name: Horizontal-overflow + sticky-opaque guard @360/390 (viewport حقيقي)
        run: node tests/perf/overflow-guard.mjs
      - name: Self-check — اختبار الرسم التدريجي يرسب بلا flush
        run: node tests/perf/progressive-search.mjs --broken
      - name: Progressive render does not break search-over-all
        run: node tests/perf/progressive-search.mjs
