name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS syntax check (main <script> block)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=h.lastIndexOf('\n<script>\n');const e=h.lastIndexOf('\n</script>');fs.writeFileSync('/tmp/main.js',h.slice(s+9,e));"
          node --check /tmp/main.js
      - name: Batch (أ) storage/offline invariants
        run: node tests/batch-a-invariants.mjs
      - name: Batch (ب-٢) unified-list static guards
        run: node tests/b2-invariants.mjs
      - name: Batch (ب-٢) analyzeBatch count separation (mechanical)
        run: node tests/b2-analyze-counts.mjs
      - name: Self-check — missed_rounds guard يرسب بلا بوابة الرفع
        run: node tests/b2-missed-rounds.mjs --broken
      - name: Batch (ج) missed_rounds upload-hook (mechanical)
        run: node tests/b2-missed-rounds.mjs
      - name: Self-check — run() regression guard يرسب بحذف ثابت
        run: node tests/b3-run-regression.mjs --broken
      - name: Batch (ج البند ٣) run() structural regression
        run: node tests/b3-run-regression.mjs
      - name: Self-check — حارس التوكنات يرسب على var(--X) لتوكن غير معرّف
        run: node tests/token-defs.mjs --broken
      - name: توكنات — لا var(--X) بلا fallback لتوكن غير معرّف (سقوط صامت)
        run: node tests/token-defs.mjs
      - name: Self-check — حارس الزجاج يرسب على backdrop-filter مصطنع في صفّ قائمة
        run: node tests/glass-rows.mjs --broken
      - name: §٢ الزجاج — لا تسرّب backdrop-filter إلى صفوف القائمة الموحّدة
        run: node tests/glass-rows.mjs

  perf-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # google-chrome-stable مثبّت مسبقاً على ubuntu-latest — نستعمله بلا puppeteer/تنزيل Chromium
      - name: Locate Chrome
        run: google-chrome-stable --version || google-chrome --version
      - name: List perf benchmark (headless, synchronous)
        run: node tests/perf/run-bench.mjs --assert

  overflow-guard:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'   # puppeteer-core لا يُنزّل Chromium — نستعمل Chrome النظامي
      CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # المشغّل السلوكي يقارن نسخاً تاريخية (git show 8bb0486 / 917989d)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locate Chrome
        run: google-chrome-stable --version
      - name: Install deps (puppeteer-core فقط)
        run: npm ci
      - name: Self-check — حارس التجاوز يرسب على الكود المعطوب
        run: node tests/perf/overflow-guard.mjs --broken
      - name: Horizontal-overflow + sticky-opaque guard @360/390 (viewport حقيقي)
        run: node tests/perf/overflow-guard.mjs
      - name: Self-check — حارس احتواء .mcard يرسب على عنصر 900px محقون
        run: node tests/perf/mcard-containment.mjs --broken
      - name: احتواء .mcard — لا عنصر يتجاوز حدود البطاقة @360/390
        run: node tests/perf/mcard-containment.mjs
      - name: §٦ الشريط المتحرّك — المسار ≥ ضعف الحاوية (1·3·30، بلا فجوة)
        run: node tests/perf/marquee-loop.mjs
      - name: Self-check — اختبار الرسم التدريجي يرسب بلا flush
        run: node tests/perf/progressive-search.mjs --broken
      - name: Progressive render does not break search-over-all
        run: node tests/perf/progressive-search.mjs
      - name: Behavioral run() harness (ج-١ حياد · ٤ فورية · ٥ إجماع · صمام · ٣+١ عودة + أسنان)
        run: node tests/behavioral/run-behavior.mjs
      - name: Self-check — حارس التباين يرسب على نصّ منخفض التباين
        run: node tests/perf/contrast-guard.mjs --broken
      - name: Contrast guard WCAG 4.5:1 (مشاهد × 360/1200)
        run: node tests/perf/contrast-guard.mjs
