name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  static-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JS syntax check (main <script> block)
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8').replace(/\r\n/g,'\n');const s=h.lastIndexOf('\n<script>\n');const e=h.lastIndexOf('\n</script>');fs.writeFileSync('/tmp/main.js',h.slice(s+9,e));"
          node --check /tmp/main.js
      - name: Self-check — حارس المعرّفات اليتيمة يرصد معرّفاً محقوناً
        run: node tests/dead-ids.mjs --broken
      - name: معرّفات يتيمة — لا مُحدِّد في JS بلا عنصر في الترميز (فشل صامت)
        run: node tests/dead-ids.mjs
      - name: Self-check — حارس CRLF يرسب بإزالة التطبيع (الفخّ حقيقي)
        run: node tests/crlf-safe.mjs --broken
      - name: CRLF — الحراس الساكنة تمرّ على نسخة نهايات أسطرها CRLF (ويندوز)
        run: node tests/crlf-safe.mjs
      - name: Batch (أ) storage/offline invariants
        run: node tests/batch-a-invariants.mjs
      - name: Self-check — حارس version-sync يرسب على انحراف version.txt
        run: node tests/version-sync.mjs --broken
      - name: version-sync — version.txt == APP_VERSION (شريط النسخة يعرض القيمة الصحيحة)
        run: node tests/version-sync.mjs
      - name: Self-check — حارس مخطّط الفروع (G5) يرسب بإزالة on delete cascade
        run: node tests/inv-branch-schema.mjs --broken
      - name: "G5 (دفعة ١أ) — ضمانات مخطّط الفروع: FK cascade · مفتاح مركّب · not null (لا صفوف يتيمة)"
        run: node tests/inv-branch-schema.mjs
      - name: Batch (ب-٢) unified-list static guards
        run: node tests/b2-invariants.mjs
      - name: Batch (ب-٢) analyzeBatch count separation (mechanical)
        run: node tests/b2-analyze-counts.mjs
      - name: Self-check — missed_rounds guard يرسب بلا بوابة الرفع
        run: node tests/b2-missed-rounds.mjs --broken
      - name: Batch (ج) missed_rounds upload-hook (mechanical)
        run: node tests/b2-missed-rounds.mjs
      - name: Self-check — run() regression guard يرسب بحذف ثابت
        run: node tests/b3-run-regression.mjs --broken
      - name: Batch (ج البند ٣) run() structural regression
        run: node tests/b3-run-regression.mjs
      - name: Self-check — حارس التوكنات يرسب على var(--X) لتوكن غير معرّف
        run: node tests/token-defs.mjs --broken
      - name: توكنات — لا var(--X) بلا fallback لتوكن غير معرّف (سقوط صامت)
        run: node tests/token-defs.mjs
      - name: §ب-٤ إيموجي — لا محرف تصويري في سياق الواجهة (عدا ↩ ⚠ ⚙)
        run: node tests/perf/emoji-guard.mjs
      - name: بطاقات الإحصاء — لا بطاقة قابلة للنقر بلا حالة نشطة (data-card)
        run: node tests/stat-active.mjs
      - name: Self-check — حارس الزجاج يرسب على backdrop-filter مصطنع في صفّ قائمة
        run: node tests/glass-rows.mjs --broken
      - name: §٢ الزجاج — لا تسرّب backdrop-filter إلى صفوف القائمة الموحّدة
        run: node tests/glass-rows.mjs

  perf-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # google-chrome-stable مثبّت مسبقاً على ubuntu-latest — نستعمله بلا puppeteer/تنزيل Chromium
      - name: Locate Chrome
        run: google-chrome-stable --version || google-chrome --version
      - name: List perf benchmark (headless, synchronous)
        run: node tests/perf/run-bench.mjs --assert

  overflow-guard:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'   # puppeteer-core لا يُنزّل Chromium — نستعمل Chrome النظامي
      CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # المشغّل السلوكي يقارن نسخاً تاريخية (git show 8bb0486 / 917989d)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Locate Chrome
        run: google-chrome-stable --version
      - name: Install deps (puppeteer-core فقط)
        run: npm ci
      - name: Self-check — حارس كشف الأعمدة يرسب بتعطيل قاعدة السعر المجرّد
        run: node tests/inv-cols.mjs --broken
      - name: كشف أعمدة المخزن (G1) — السعر بمرادفاته · الكميه(هاء) · الباركورد(خطأ) · أعلام found
        run: node tests/inv-cols.mjs
      - name: Self-check — حارس حماية الرفع يرسب بتعطيل فحص السعر
        run: node tests/perf/upload-reject.mjs --broken
      - name: حماية الرفع (G2) — عمود جوهري مفقود ⇒ رفض غنيّ في البطاقة بلا اعتماد
        run: node tests/perf/upload-reject.mjs
      - name: Self-check — حارس المسار الكامل يرسب بتعطيل قبول «الباركورد» كوداً
        run: node tests/perf/inv-upload-fullpath.mjs --broken
      - name: المسار الكامل للرفع — الكود والسعر (القيمة) يصلان bulkUpsert بالرؤوس الحقيقية
        run: node tests/perf/inv-upload-fullpath.mjs
      - name: Self-check — حارس عزل الفرع (G1) يرسب بإزالة تحجيم الحذف
        run: node tests/perf/inv-branch-isolation.mjs --broken
      - name: G1 (دفعة ١أ) — رفع فرع يحذف داخل نطاقه فقط ولا يمسّ فرعاً آخر (عزل)
        run: node tests/perf/inv-branch-isolation.mjs
      - name: Self-check — حارس النفاذ (G-THROUGH) يرسب بعكس ترتيب الفروع
        run: node tests/perf/inv-branch-through.mjs --broken
      - name: G-THROUGH (دفعة ١أ) — المخزن الموحّد نفسه ⇒ المخرج نفسه (كمية مجموعة · سعر أقدم فرع · فرع≡فرعان)
        run: node tests/perf/inv-branch-through.mjs
      - name: Self-check — حارس G-STALE يرسب بإزالة إعادة التحميل ＋ تعطيل الحارس البنيوي
        run: node tests/perf/inv-stale-merge.mjs --broken
      - name: G-STALE (سلامة المدخل) — رفع المستودع يحمّل الفروع · الموحّد المبتور يوقف المطابقة (لا أرقام صامتة)
        run: node tests/perf/inv-stale-merge.mjs
      - name: Self-check — حارس G-GATE يرسب بإعادة أساس البوّابة الإجماليّ
        run: node tests/perf/inv-branch-gate.mjs --broken
      - name: G-GATE (دفعة ١ب) — بوّابة الانكماش تقارن الفرع بمرجعه هو لا بالإجمالي (لا إنذار كاذب)
        run: node tests/perf/inv-branch-gate.mjs
      - name: Self-check — حارس G-NAV يرسب بإعادة الانتقال التلقائي للرئيسية
        run: node tests/perf/inv-nav-stay.mjs --broken
      - name: G-NAV (دفعة ٢) — بعد الرفع تبقى الصفحة كما هي والمطابقة تُعاد في الخلفية (لا انتقال تلقائي)
        run: node tests/perf/inv-nav-stay.mjs
      - name: Self-check — حارس G-FILT يرسب بإسقاط republish من عدّاد السعر
        run: node tests/perf/upd-filter.mjs --broken
      - name: G-FILT — فلتر «تم تحديثه» (شمول واستبعاد · عرض محض · فلتر×بحث)
        run: node tests/perf/upd-filter.mjs
      - name: Self-check — حارس G-SRC يرسب بجمع الفروع في مصدر واحد
        run: node tests/perf/query-sources.mjs --broken
      - name: G-SRC — تفصيل مصادر الاستعلام لكل فرع (عرض محض · الموحّد ثابت)
        run: node tests/perf/query-sources.mjs
      - name: Self-check — حارس G-CARDSRC يرسب بإزالة أرقام المصادر
        run: node tests/perf/card-sources.mjs --broken
      - name: G-CARDSRC — تفصيل المصادر في بطاقة المطابقة بالقيمة (العزيزية 6 · الخضرة 11)
        run: node tests/perf/card-sources.mjs
      - name: Self-check — حارس G-TIGHTEN يرسب بإعادة مسار score≥80
        run: node tests/perf/match-tighten.mjs --broken
      - name: G-TIGHTEN (T1) — أخضر=تطابق اسم تامّ وحيد فقط (BP162/BP164+alias لا يصير أخضر)
        run: node tests/perf/match-tighten.mjs
      - name: Self-check — حارس G-EXPUNLINK يرسب بخلط «رابط محفوظ» بالمطابَق بالكود
        run: node tests/perf/explorer-unlink.mjs --broken
      - name: G-EXPUNLINK — المستكشف يعزل الرابط المحفوظ (mappings) للإلغاء الدفعيّ
        run: node tests/perf/explorer-unlink.mjs
      - name: Self-check — حارس دوام إلغاء الربط يرسب بترك matchedHistory
        run: node tests/perf/unlink-persist.mjs --broken
      - name: G-UNLINK-PERSIST — إلغاء الربط دائم عبر إعادة التحميل (لا يعود «غائباً»⇒صفر · لا بانر ترحيل)
        run: node tests/perf/unlink-persist.mjs
      - name: Self-check — حارس G-HIST-SOURCE يرسب بإعادة اتحاد HIST_KEY في loadConfig
        run: node tests/perf/hist-source.mjs --broken
      - name: G-HIST-SOURCE — تاريخ المطابقة مصدره القاعدة وحدها (loadConfig لا يقرأ ملف/localStorage · histIncomplete عند الفشل)
        run: node tests/perf/hist-source.mjs
      - name: Self-check — حارس G-OFFSET-SOURCE يرسب بتسريب البذرة للحيّ في loadConfig
        run: node tests/perf/offset-source.mjs --broken
      - name: G-OFFSET-SOURCE — زيادات الأسعار مصدرها القاعدة (loadConfig بذرة فقط · ترحيل تلقائيّ)
        run: node tests/perf/offset-source.mjs
      - name: Self-check — حارس G-TOTALS يرسب على المطابقة الجزئية (includes)
        run: node tests/totals-filter.mjs --broken
      - name: G-TOTALS — تجاهل صفوف المجاميع بمطابقة تامّة (الأصناف الحقيقية تبقى)
        run: node tests/totals-filter.mjs
      - name: Self-check — حارس G-VALVE يرسب بإسقاط شرط updated==0
        run: node tests/valve-absent.mjs --broken
      - name: G-VALVE — صمّام updated=0 ＋ تصفير غيابيّ (الحالات الثلاث تفصل بوضوح)
        run: node tests/valve-absent.mjs
      - name: G-TAX — ضريبة 15% على أسعار المخزن (100⇒115 · لا تراكم · كشف الشامل · المستودع+الفروع)
        run: node tests/perf/vat.mjs
      - name: Self-check — حارس G-WAIT-DECIDE يرسب بإعادة تعطيل «غير متوفر»
        run: node tests/perf/wait-decide.mjs --broken
      - name: G-WAIT-DECIDE — «غير متوفر» قرار فاعل دائماً يُخلي «يحتاج ربط»
        run: node tests/perf/wait-decide.mjs
      - name: Self-check — حارس شرائح «يحتاج ربط» يرسب بتثبيت btMode="all"
        run: node tests/perf/uni-filter-chips.mjs --broken
      - name: G-UNI-CHIPS — شرائح فلتر «يحتاج ربط» قابلة للنقر ＋ «بلا مرشّح» ＋ «غير متوفر للمعروض» دفعيّ
        run: node tests/perf/uni-filter-chips.mjs
      - name: Self-check — حارس توحيد العدّاد يرسب بإعادة KPI للطول الخام
        run: node tests/perf/count-consistency.mjs --broken
      - name: G-COUNT — رقم واحد لمفهوم «يحتاج ربط» (KPI==انتباهك==القائمة==الشريحة==اللافتة)
        run: node tests/perf/count-consistency.mjs
      - name: Self-check — حارس محرّك الحركات يرسب بعكس تعيين النوع
        run: node tests/perf/move-record.mjs --broken
      - name: G-MOVE — محرّك حركات المبيعات المقدّرة (بيع/شراء/جديد/اختفى · سعر مثبَّت · معزول)
        run: node tests/perf/move-record.mjs
      - name: Self-check — حارس صمّام الرفعة الشاذّة يرسب برفع العتبة
        run: node tests/perf/move-valve.mjs --broken
      - name: G-VALVE-MOVE — صمّام الرفعة الشاذّة (8%＋أرضية 10، يوقف التسجيل لا الرفعة)
        run: node tests/perf/move-valve.mjs
      - name: Self-check — حارس نواة لوحة المبيعات يرسب بخلط الشراء بالبيع
        run: node tests/perf/sales-core.mjs --broken
      - name: G-SALES-CORE — نواة لوحة المبيعات (القيمة من البيع المقدّر · المشبوهة مستبعَدة · الفارغة رسالة)
        run: node tests/perf/sales-core.mjs
      - name: Self-check — حارس تفصيل المبيعات يرسب بإلغاء بوّابة «التاريخ غير كافٍ»
        run: node tests/perf/sales-detail.mjs --broken
      - name: G-SALES-DETAIL — تبويب + الأكثر مبيعاً + الراكد/النفاد مبوّبان بالتاريخ غير الكافٍ + البحث
        run: node tests/perf/sales-detail.mjs
      - name: Self-check — حارس بوّابة التغطية يرسب بإلغاء salesCovInsufficient
        run: node tests/perf/sales-coverage.mjs --broken
      - name: G-SALES-COV — التغطية مبوّبة «يلزم 14 يوماً» عند رصد قصير (مؤشّرات المعدّل اليوميّ)
        run: node tests/perf/sales-coverage.mjs
      - name: Self-check — G-MOVED يرسب حين صفّ الإجمالي = مجموع الأعمدة لا الفريد
        run: node tests/perf/sales-moved.mjs --broken
      - name: G-MOVED — «متحرّكة» = الأصناف الفريدة (بطاقة=تفصيل=إجمالي) ＋ وسم العابر
        run: node tests/perf/sales-moved.mjs
      - name: Self-check — G-TREND يرسب بمقارنة المجاميع (انخفاض وهميّ)
        run: node tests/perf/sales-trend.mjs --broken
      - name: G-TREND — «عن السابق» مطبَّعة معدّلاً يوميّاً ＋ إظهار الطولين
        run: node tests/perf/sales-trend.mjs
      - name: Self-check — G-BASELINE يرسب حين لا تُستبعَد رفعة التأسيس
        run: node tests/perf/sales-baseline.mjs --broken
      - name: G-BASELINE — رفعة التأسيس مستبعَدة من العدّ والمقارنة
        run: node tests/perf/sales-baseline.mjs
      - name: Self-check — G-NOUPLOAD يرسب حين الموقع الغائب يظهر بأصفار/-100%
        run: node tests/perf/sales-noupload.mjs --broken
      - name: G-NOUPLOAD — موقع بلا رفعة ⇒ «لا رفعة» ومستبعَد من الإجماليّ ＋ صمّام
        run: node tests/perf/sales-noupload.mjs
      - name: Self-check — G-TAX يرسب حين «قبل الضريبة» تُشتقّ بالقسمة على 1.15
        run: node tests/perf/sales-tax.mjs --broken
      - name: G-TAX — «قبل الضريبة» من unit_price_excl مباشرةً لا ضرباً/قسمةً
        run: node tests/perf/sales-tax.mjs
      - name: Self-check — G-TZ يرسب حين يُشتقّ اليوم بـUTC لا بتوقيت الرياض
        run: node tests/perf/sales-tz.mjs --broken
      - name: G-TZ — اليوم التقويميّ بتوقيت الرياض (UTC+3) لا UTC/متصفّح القارئ
        run: node tests/perf/sales-tz.mjs
      - name: Self-check — G-BIZDATE يرسب حين النقطة على يوم الرفعة لا يوم العمل
        run: node tests/perf/sales-bizdate.mjs --broken
      - name: G-BIZDATE — العرض التجاريّ على business_date (اليوم السابق للرفعة) + الحركات سليمة
        run: node tests/perf/sales-bizdate.mjs
      - name: Self-check — G-MULTIDAY يرسب حين لا يُتتبَّع نطاق الفترة المتعدّدة
        run: node tests/perf/sales-multiday.mjs --broken
      - name: G-MULTIDAY — الفترة المتعدّدة نقطة واحدة موسومة بالنطاق (لا تقسيم/عدد)
        run: node tests/perf/sales-multiday.mjs
      - name: Self-check — G-SINGLEPOINT يرسب حين تختفي النقطة المنفردة من الرسم
        run: node tests/perf/sales-singlepoint.mjs --broken
      - name: G-SINGLEPOINT — موقع بنقطة واحدة وقيمة>0 له علامة بارزة (لا يختفي)
        run: node tests/perf/sales-singlepoint.mjs
      - name: Self-check — G-TAX-STOCK يرسب حين يُحسب الصنف بلا price_excl صفراً
        run: node tests/perf/sales-tax-stock.mjs --broken
      - name: G-TAX-STOCK — قيمة المخزون قبل الضريبة من price_excl؛ الناقص مستبعَد بعدّاد
        run: node tests/perf/sales-tax-stock.mjs
      - name: Self-check — G-YESTERDAY يرسب حين نافذة «أمس» تستعمل يوم الرفعة لا يوم العمل
        run: node tests/perf/sales-yesterday.mjs --broken
      - name: G-YESTERDAY — زرّ «أمس» ونافذته = business_date أمس (لا يوم الرفعة)
        run: node tests/perf/sales-yesterday.mjs
      - name: Self-check — G-UPLOAD-STATUS يرسب حين يُقلب معيار 24 ساعة
        run: node tests/perf/upload-status.mjs --broken
      - name: G-UPLOAD-STATUS — شارة الرفع (24س · owner+admin فقط · رسالة المتأخّر)
        run: node tests/perf/upload-status.mjs
      - name: Self-check — حارس عزل الأدوار يرسب بإظهار المبيعات لـadmin
        run: node tests/perf/role-sales.mjs --broken
      - name: G-ROLE-SALES — عزل شاشة المبيعات بالدور (واجهة + بنية SQL؛ admin بلا شاشة · marketing عليها فقط)
        run: node tests/perf/role-sales.mjs
      - name: Self-check — G-CMP-LAYOUT يرسب حين يُبتر محور الرسم (بلا direction:ltr)
        run: node tests/perf/sales-cmp-layout.mjs --broken
      - name: G-CMP-LAYOUT — جدول المقارنة بلا تلاصق ＋ وحدات عربية ملتصقة ＋ محور الرسم بلا بتر
        run: node tests/perf/sales-cmp-layout.mjs
      - name: Self-check — حارس التجاوز يرسب على الكود المعطوب
        run: node tests/perf/overflow-guard.mjs --broken
      - name: Horizontal-overflow + sticky-opaque guard @360/390 (viewport حقيقي)
        run: node tests/perf/overflow-guard.mjs
      - name: Self-check — حارس احتواء .mcard يرسب على عنصر 900px محقون
        run: node tests/perf/mcard-containment.mjs --broken
      - name: احتواء .mcard — لا عنصر يتجاوز حدود البطاقة @360/390
        run: node tests/perf/mcard-containment.mjs
      - name: Self-check — حارس الشريط يرسب على اقتطاع القائمة (تنوّع لا طول)
        run: node tests/perf/marquee-loop.mjs --broken
      - name: §٦ الشريط — الفريدة == min(30, needCount+absentCount) · ≤6 ساكن · >6 انزلاق · التسمية بالعدد
        run: node tests/perf/marquee-loop.mjs
      - name: Self-check — حارس خمول الشريط يرسب على النسخة قبل الإصلاح (إعادة رسم تصفّر الحركة)
        run: node tests/perf/marquee-idle.mjs --broken
      - name: §٦ خمول الشريط — إعادة الرسم بنفس البيانات لا تصفّر الحركة (تستمرّ) · تغيّر البيانات يعيد البناء
        run: node tests/perf/marquee-idle.mjs
      - name: Self-check — حارس رؤية الشريط يرسب على عطل تموضع RTL (viewport يفرغ)
        run: node tests/perf/marquee-visible.mjs --broken
      - name: §٦ رؤية الشريط — العناصر تعبر viewport عبر الدورة كاملةً (لا فجوة · المتمايزة == min(30,المجتمع))
        run: node tests/perf/marquee-visible.mjs
